<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Rondas - Reporte PDF</title>
    
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 p-4 text-center border-b border-slate-700 shadow-md">
        <h1 class="text-xl font-bold tracking-wider text-emerald-400">CONTROL DE RONDAS</h1>
        <p class="text-xs text-slate-400 mt-1">Registro de Seguridad por GPS</p>
    </header>

    <main class="p-4 max-w-md mx-auto w-full flex-grow flex flex-col justify-start gap-6">
        
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm text-center">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Estado del Recorrido</h2>
            <div id="estadoTexto" class="text-lg font-bold mt-2 text-amber-400">No Iniciado</div>
            <div id="infoRondaActual" class="text-xs text-slate-400 mt-1 hidden">
                Puestos marcados: <span id="contadorPuestos" class="font-bold text-slate-200">0</span>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <button id="btnInicio" onclick="iniciarRecorrido()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all transform active:scale-95 text-lg">
                ▶ Iniciar Recorrido
            </button>

            <button id="btnPuesto" onclick="marcarPuesto()" class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:opacity-40 text-white font-bold py-6 px-6 rounded-xl shadow-lg transition-all transform active:scale-95 text-xl hidden">
                📍 Marcar Puesto <span id="siguientePuestoNum">1</span>
            </button>

            <button id="btnFin" onclick="finalizarRecorrido()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all transform active:scale-95 text-lg hidden">
                ⏹ Terminar Recorrido
            </button>
        </div>

        <hr class="border-slate-700 my-2">

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3 text-center">Generar Reporte PDF</h3>
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Fecha Desde:</label>
                    <input type="date" id="fechaDesde" class="w-full bg-slate-700 text-white text-sm rounded p-2 border border-slate-600 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Fecha Hasta:</label>
                    <input type="date" id="fechaHasta" class="w-full bg-slate-700 text-white text-sm rounded p-2 border border-slate-600 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <button onclick="exportarPDF()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-colors">
                📄 Exportar a PDF
            </button>
        </div>

    </main>

    <footer class="bg-slate-950 p-2 text-center text-[10px] text-slate-500">
        Datos almacenados localmente en el dispositivo.
    </footer>

    <script>
        let enRecorrido = false;
        let idRondaActual = null;
        let contadorPuestos = 0;

        window.onload = function() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaDesde').value = hoy;
            document.getElementById('fechaHasta').value = hoy;

            const rondaGuardada = localStorage.getItem('ronda_activa');
            if (rondaGuardada) {
                const datos = JSON.parse(rondaGuardada);
                enRecorrido = true;
                idRondaActual = datos.idRonda;
                contadorPuestos = datos.contador;
                actualizarInterfaz();
            }
        };

        function actualizarInterfaz() {
            const btnInicio = document.getElementById('btnInicio');
            const btnPuesto = document.getElementById('btnPuesto');
            const btnFin = document.getElementById('btnFin');
            const estadoTexto = document.getElementById('estadoTexto');
            const infoRondaActual = document.getElementById('infoRondaActual');
            const siguientePuestoNum = document.getElementById('siguientePuestoNum');
            const contPuestosText = document.getElementById('contadorPuestos');

            if (enRecorrido) {
                btnInicio.classList.add('hidden');
                btnPuesto.classList.remove('hidden');
                btnFin.classList.remove('hidden');
                estadoTexto.innerText = "EN RECORRIDO";
                estadoTexto.className = "text-lg font-bold mt-2 text-emerald-400 animate-pulse";
                infoRondaActual.classList.remove('hidden');
                contPuestosText.innerText = contadorPuestos;
                siguientePuestoNum.innerText = contadorPuestos + 1;
            } else {
                btnInicio.classList.remove('hidden');
                btnPuesto.classList.add('hidden');
                btnFin.classList.add('hidden');
                estadoTexto.innerText = "NO INICIADO";
                estadoTexto.className = "text-lg font-bold mt-2 text-amber-400";
                infoRondaActual.classList.add('hidden');
            }
        }

        function obtenerGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    alert("Tu navegador o dispositivo no soporta Geo-localización.");
                    resolve({ lat: "No Soportado", lon: "No Soportado" });
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({ lat: position.coords.latitude, lon: position.coords.longitude });
                    },
                    (error) => {
                        console.error(error);
                        alert("Error al obtener GPS. Activa la ubicación y concede permisos.");
                        resolve({ lat: "Sin Permiso", lon: "Sin Permiso" });
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function iniciarRecorrido() {
            if (confirm("¿Desea iniciar un nuevo recorrido de ronda?")) {
                document.getElementById('btnInicio').disabled = true;
                document.getElementById('btnInicio').innerText = "Obteniendo GPS...";

                const gps = await obtenerGPS();
                const ahora = new Date();
                
                idRondaActual = "Ronda #" + ahora.getTime().toString().slice(-6);
                contadorPuestos = 0;
                enRecorrido = true;

                const registroInicio = {
                    idRonda: idRondaActual,
                    fecha: ahora.toISOString().split('T')[0],
                    hora: ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
                    evento: "INICIO RECORRIDO",
                    coordenadas: gps.lat !== "Sin Permiso" && gps.lat !== "No Soportado" ? `${gps.lat}, ${gps.lon}` : "N/A",
                    mapaLink: gps.lat !== "Sin Permiso" && typeof gps.lat === 'number' ? `https://maps.google.com/?q=${gps.lat},${gps.lon}` : ""
                };

                guardarRegistro(registroInicio);
                guardarEstadoRondaActiva();
                
                document.getElementById('btnInicio').disabled = false;
                document.getElementById('btnInicio').innerText = "▶ Iniciar Recorrido";
                
                actualizarInterfaz();
            }
        }

        async function marcarPuesto() {
            const btnPuesto = document.getElementById('btnPuesto');
            btnPuesto.disabled = true;
            const originalText = btnPuesto.innerHTML;
            btnPuesto.innerText = "Localizando...";

            const gps = await obtenerGPS();
            const ahora = new Date();
            contadorPuestos++;

            const registroPuesto = {
                idRonda: idRondaActual,
                fecha: ahora.toISOString().split('T')[0],
                hora: ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
                evento: `Puesto ${contadorPuestos}`,
                coordenadas: gps.lat !== "Sin Permiso" && gps.lat !== "No Soportado" ? `${gps.lat}, ${gps.lon}` : "N/A",
                mapaLink: gps.lat !== "Sin Permiso" && typeof gps.lat === 'number' ? `https://maps.google.com/?q=${gps.lat},${gps.lon}` : ""
            };

            guardarRegistro(registroPuesto);
            guardarEstadoRondaActiva();

            btnPuesto.disabled = false;
            btnPuesto.innerHTML = originalText;

            actualizarInterfaz();
        }

        async function finalizarRecorrido() {
            if (confirm("¿Está seguro que desea TERMINAR el recorrido actual?")) {
                const btnFin = document.getElementById('btnFin');
                btnFin.disabled = true;
                btnFin.innerText = "Cerrando...";

                const gps = await obtenerGPS();
                const ahora = new Date();

                const registroFin = {
                    idRonda: idRondaActual,
                    fecha: ahora.toISOString().split('T')[0],
                    hora: ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
                    evento: "FIN RECORRIDO",
                    coordenadas: gps.lat !== "Sin Permiso" && gps.lat !== "No Soportado" ? `${gps.lat}, ${gps.lon}` : "N/A",
                    mapaLink: gps.lat !== "Sin Permiso" && typeof gps.lat === 'number' ? `https://maps.google.com/?q=${gps.lat},${gps.lon}` : ""
                };

                guardarRegistro(registroFin);
                
                localStorage.removeItem('ronda_activa');
                enRecorrido = false;
                idRondaActual = null;
                contadorPuestos = 0;

                btnFin.disabled = false;
                btnFin.innerText = "⏹ Terminar Recorrido";

                actualizarInterfaz();
                alert("Recorrido cerrado y guardado con éxito.");
            }
        }

        function guardarRegistro(nuevoRegistro) {
            let registros = JSON.parse(localStorage.getItem('rondas_logs')) || [];
            registros.push(nuevoRegistro);
            localStorage.setItem('rondas_logs', JSON.stringify(registros));
        }

        function guardarEstadoRondaActiva() {
            const estado = { idRonda: idRondaActual, contador: contadorPuestos };
            localStorage.setItem('ronda_activa', JSON.stringify(estado));
        }

        // FUNCIÓN DE EXPORTACIÓN DIRECTA A PDF NATIVO
        function exportarPDF() {
            const desde = document.getElementById('fechaDesde').value;
            const hasta = document.getElementById('fechaHasta').value;

            if (!desde || !hasta) {
                alert("Por favor, selecciona el rango de fechas.");
                return;
            }

            const todosLosRegistros = JSON.parse(localStorage.getItem('rondas_logs')) || [];
            const filtrados = todosLosRegistros.filter(reg => reg.fecha >= desde && reg.fecha <= hasta);

            if (filtrados.length === 0) {
                alert("No se encontraron registros en el rango de fechas seleccionado.");
                return;
            }

            const ventanaImpresion = window.open('', '_blank');
            
            let tablaHTML = '';
            filtrados.forEach(reg => {
                const linkMapa = reg.mapaLink ? `<a href="${reg.mapaLink}" target="_blank" style="color: #0284c7; text-decoration: underline; font-weight: bold;">Ver Mapa ➔</a>` : 'N/A';
                tablaHTML += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 10px; text-align: left;">${reg.idRonda}</td>
                        <td style="padding: 10px; text-align: center;">${reg.fecha.split('-').reverse().join('/')}</td>
                        <td style="padding: 10px; text-align: center;">${reg.hora}</td>
                        <td style="padding: 10px; text-align: left; font-weight: 600;">${reg.evento}</td>
                        <td style="padding: 10px; text-align: left; font-size: 11px; font-family: monospace; color: #475569;">${reg.coordenadas}</td>
                        <td style="padding: 10px; text-align: center;">${linkMapa}</td>
                    </tr>
                `;
            });

            ventanaImpresion.document.write(`
                <html>
                <head>
                    <title>Reporte de Rondas de Seguridad</title>
                    <style>
                        @page { size: A4; margin: 15mm 12mm; }
                        body { font-family: Arial, sans-serif; color: #1e293b; margin: 0; padding: 0; background-color: #ffffff; }
                        .header { background-color: #0f172a; color: #ffffff; padding: 20px; border-radius: 6px; margin-bottom: 25px; }
                        .header h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; color: #34d399; }
                        .header p { margin: 5px 0 0 0; font-size: 12px; color: #94a3b8; }
                        .meta-info { margin-bottom: 20px; font-size: 13px; color: #334155; background: #f8fafc; padding: 12px; border-radius: 6px; border-left: 4px solid #34d399; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
                        th { background-color: #1e293b; color: #ffffff; padding: 12px 10px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
                        tr:nth-child(even) { background-color: #f8fafc; }
                        .footer { margin-top: 30px; border-top: 1px solid #cbd5e1; padding-top: 8px; text-align: center; font-size: 10px; color: #64748b; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>REPORTE OFICIAL DE CONTROL DE RONDAS</h1>
                        <p>Sistema Digital de Auditoría de Vigilancia y Coordenadas GPS</p>
                    </div>
                    
                    <div class="meta-info">
                        <strong>Rango de Búsqueda Solicitado:</strong> Desde el ${desde.split('-').reverse().join('/')} hasta el ${hasta.split('-').reverse().join('/')}<br>
                        <strong>Total de Puntos y Eventos Registrados:</strong> ${filtrados.length} marcas.
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: left; width: 15%;">ID Ronda</th>
                                <th style="text-align: center; width: 15%;">Fecha</th>
                                <th style="text-align: center; width: 15%;">Hora</th>
                                <th style="text-align: left; width: 20%;">Puesto / Evento</th>
                                <th style="text-align: left; width: 20%;">Coordenadas GPS</th>
                                <th style="text-align: center; width: 15%;">Ubicación</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tablaHTML}
                        </tbody>
                    </table>

                    <div class="footer">
                        Documento generado automáticamente por la aplicación de Control de Rondas. Las marcas contienen enlaces de geolocalización satelital auditables.
                    </div>

                    <script>
                        window.onload = function() {
                            window.print();
                        };
                    <\/script>
                </body>
                </html>
            `);
            ventanaImpresion.document.close();
        }
    </script>
</body>
</html>
